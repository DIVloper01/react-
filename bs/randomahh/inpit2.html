<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
  <body>
    <table>
        <tr>
            <th class="border px-4 py-2">Name</th>
            <th class="border px-4 py-2">Age</th>
            <th class="border px-4 py-2">Occupation</th>
            <th class="border px-4 py-2">Salary</th>
        </tr>
    </table>
    
    <script>
      let data = [
        {
          Name: "Alice",
          Age: 30,
          Occupation: "Engineer",
          Salary: 70000,
        },

        {
          Name: "Bob",
          Age: 25,
          Occupation: "Designer",
          Salary: 50000,
        },
      ];
    let newdata = data.map
        data.map((item)=>{
            return `<tr>
                <td class="border px-4 py-2">${item.Name}</td>
                <td class="border px-4 py-2">${item.Age}</td>
                <td class="border px-4 py-2">${item.Occupation}</td>
                <td class="border px-4 py-2">${item.Salary}</td>
                </tr>`

        })
        element.innerHTML += newdata.join("");
    </script>
  </body>
</html>
